services:
  postgres:
    image: postgres:17
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    build:
      context: ./docker/minio
    image: taskmanager-minio:local
    container_name: taskmanager-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: taskmanager
      MINIO_ROOT_PASSWORD: taskmanager-secret

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

    volumes:
      - minio_data:/data

  migrate:
    image: migrate/migrate:v4.20.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://taskmanager:taskmanager@postgres:5432/taskmanager?sslmode=disable", "up"]

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env.example
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      DATABASE_URL: postgres://taskmanager:taskmanager@postgres:5432/taskmanager?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
