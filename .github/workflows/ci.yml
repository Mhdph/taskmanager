name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskmanager_test
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager -d taskmanager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TASKMANAGER_TEST_DATABASE_URL: postgres://taskmanager:test-only-password@localhost:5432/taskmanager_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
